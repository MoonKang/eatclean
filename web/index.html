<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Georgia Restaurant Inspection Map</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <!-- On phones the panel starts hidden; this button opens it. -->
  <button id="menu-toggle" class="menu-toggle" type="button" aria-label="Search and filters"
          aria-expanded="false" aria-controls="panel">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span class="menu-dot" hidden></span>
  </button>

  <div class="panel" id="panel">
    <div class="panel-head">
      <h1>Georgia Restaurant Inspections</h1>
      <button id="panel-close" class="panel-close" type="button" aria-label="Close search and filters">×</button>
    </div>
    <div class="search">
      <input id="search" type="search" placeholder="Name, category or Google Maps link" autocomplete="off" aria-label="Search by restaurant name, category or Google Maps link">
      <ul id="results" hidden></ul>
    </div>
    <div id="cat-filter" class="cat-filter" hidden
         title="Categories come from OpenStreetMap and are known for about 1 in 5 restaurants">
      <span>🍽 <span class="cat-name"></span> · <span class="cat-count"></span> places</span>
      <button type="button" aria-label="Clear category">×</button>
    </div>
    <div class="grades" id="grades" role="group" aria-label="Filter by grade"></div>
    <label class="month">
      <span>Last inspected</span>
      <select id="month"><option value="">Any month</option></select>
    </label>
    <p class="meta" id="meta">Loading inspections…</p>
  </div>

  <aside id="drawer" hidden aria-label="Inspection history">
    <button id="drawer-close" type="button" aria-label="Close history">×</button>
    <div id="drawer-body"></div>
  </aside>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="app.js"></script>
  <!-- Cloudflare Web Analytics: cookieless page-view counts. The token is public by design. -->
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "d28a0b1c02aa475eb2e021420fdfa916"}'></script>
</body>
</html>
