<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Georgia Restaurant Inspection Map</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <div class="panel">
    <h1>Georgia Restaurant Inspections</h1>
    <div class="search">
      <input id="search" type="search" placeholder="Restaurant name or Google Maps link" autocomplete="off" aria-label="Search by restaurant name or Google Maps link">
      <ul id="results" hidden></ul>
    </div>
    <div class="grades" id="grades" role="group" aria-label="Filter by grade"></div>
    <label class="month">
      <span>Last inspected</span>
      <select id="month"><option value="">Any month</option></select>
    </label>
    <p class="meta" id="meta">Loading inspections…</p>
  </div>

  <aside id="drawer" hidden aria-label="Inspection history">
    <button id="drawer-close" type="button" aria-label="Close history">×</button>
    <div id="drawer-body"></div>
  </aside>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="app.js"></script>
  <!-- Cloudflare Web Analytics: cookieless page-view counts. The token is public by design. -->
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "d28a0b1c02aa475eb2e021420fdfa916"}'></script>
</body>
</html>
